<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#4f46e5" />
<title>Momentum — Your day, in one place</title>
<link rel="stylesheet" href="styles.css" />
<script src="config.js" onerror="window.PLANNER_CONFIG={supabaseUrl:'',supabaseAnonKey:''}"></script>
</head>
<body>
<main class="app-shell" id="app-shell">
<aside class="sidebar">
<div class="logo"><span class="brand-mark small">M</span> Momentum</div>
<nav>
<button class="nav-link active" data-view="today">☀ Today</button>
<button class="nav-link" data-view="calendar">▦ Calendar</button>
<button class="nav-link" data-view="tasks">✓ Tasks</button>
<button class="nav-link" data-view="notes">▤ Notes</button>
</nav>
<div class="sidebar-bottom"><span id="sync-status">Stored on this device</span><button class="text-button" id="signout-button">Sign out</button></div>
</aside>
<section class="content">
<header><div><p class="eyebrow" id="date-label"></p><h1 id="page-title">Good morning</h1></div><button class="primary" id="new-button">+ Add item</button></header>
<div id="view-root"></div>
</section>
</main>
<dialog id="item-dialog"><form method="dialog" id="item-form">
<div class="dialog-header"><h2 id="dialog-title">Add task</h2><button value="cancel" class="icon-button">×</button></div>
<input id="item-id" type="hidden" />
<label>Type<select id="item-type"><option value="task">Task</option><option value="event">Calendar event</option><option value="note">Note</option></select></label>
<label>Title<input id="item-title" required placeholder="What needs your attention?" /></label>
<label id="date-field">Date<input id="item-date" type="date" /></label>
<label id="time-field">Time<input id="item-time" type="time" /></label>
<label id="note-field">Details<textarea id="item-body" rows="5" placeholder="Add context, links, or ideas..."></textarea></label>
<div class="dialog-actions"><button value="cancel">Cancel</button><button class="primary" value="default">Save</button></div>
</form></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
